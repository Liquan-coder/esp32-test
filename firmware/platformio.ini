; 迷你 Jev 韌體設定。編譯＋燒錄：pio run -t upload；看輸出：pio device monitor
[env:esp32s3]
platform  = espressif32
board     = esp32-s3-devkitc-1
framework = arduino

; 你的板子是 N16R8：16MB Quad Flash + 8MB Octal PSRAM
board_build.arduino.memory_type = qio_opi
board_upload.flash_size         = 16MB         ; 燒錄時告訴 bootloader Flash 有多大
board_upload.maximum_size       = 16777216
board_build.partitions          = default_16MB.csv
build_flags =
  -DBOARD_HAS_PSRAM
  -I../train/build                             ; 直接讀 export.py 產生的 jev_model.h，重新匯出就自動更新

lib_deps = spaziochirale/Chirale_TensorFLowLite@2.0.0   ; TensorFlow Lite Micro 的 Arduino 版

monitor_speed = 115200
